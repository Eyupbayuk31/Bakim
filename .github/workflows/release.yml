name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Sürüm Etiketi (Örn: v2.5.0)'
        required: true
        default: 'v2.9.0'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Single-File Executable
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64

      - name: Rename and Package Artifacts
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          if (-not $tag) { $tag = "v2.9.0" }
          
          # Rename executable to standard ascii name for distribution
          Copy-Item "publish\win-x64\Bak*.exe" "publish\win-x64\Bakim.exe"
          
          # Create zip package
          Compress-Archive -Path "publish\win-x64\Bakim.exe" -DestinationPath "Bakim-$tag-win-x64.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          if (-not $tag) { $tag = "v2.9.0" }
          $cleanVersion = $tag.TrimStart('v', 'V')
          
          New-Item -ItemType Directory -Path "Releases" -Force | Out-Null
          Copy-Item "publish\win-x64\Bakim.exe" "Releases\Bakim.exe"
          
          $iscc = Get-Command "iscc.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
              $possiblePaths = @(
                  "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
                  "C:\Program Files\Inno Setup 6\ISCC.exe",
                  "C:\ProgramData\chocolatey\bin\iscc.exe"
              )
              $iscc = $possiblePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe bulunamadı!" }
          Write-Host "ISCC bulundu: $iscc"
          & $iscc "/DMyAppVersion=$cleanVersion" "Bakim_Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derleme hatası: $LASTEXITCODE" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Bakım ${{ env.TAG_NAME }} - İnteraktif Kalıntı Temizleyici & Dialog Guard (V42.0)
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            • **İnteraktif Kalıntı Temizleme Modalı (Residual Cleanup Dialog - V42.0)**:
              - Standart uninstaller veya MSIExec işlemi biter bitmez otomatik tetiklenen Revo stili modern kalıntı temizleme modalı eklendi.
              - Disk ve kayıt defterinde kalan artık klasör, dosya ve registry anahtarları kategorize edilmiş interaktif listede gösterilir.
              - Kategori filtreleme (Tümü, Klasörler, Dosyalar, Kayıt Defteri), toplu seçim, güvenlik rozeti (%100 Güvenli / İnceleyin) ve dinamik boyut hesaplama desteği.
              - Sağ tık menüsü ile Windows Gezgini'nde doğrudan konumu açma ve yolu kopyalama özellikleri eklendi.
              - Yüklü programlar listesindeki her öğeye tek tıkla doğrudan kalıntı analizi ve temizleme butonu entegre edildi.
            • **Sysinternals Autoruns & Persistence Analyzer (V41.0) & VirusTotal API v3**:
              - 8 Kalıcılık Vektörü, WinVerifyTrust Authenticode ve Catalog imza denetimi.
              - Ayarlar menüsünden VirusTotal API v3 anahtar kaydı, anında format/bakiye doğrulaması ve toplu hash taraması.
            • **Avcı Modu Saydamlık ve Kırpılma Düzeltmeleri**:
              - %100 opak Slate Dark `#1E293B` panel, sıfır arka plan sızması ve kırpılmayan form alanları.
          files: |
            Releases/Bakim-*-Setup.exe
            publish/win-x64/Bakim.exe
            Bakim-*.zip
