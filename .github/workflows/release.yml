name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Sürüm Etiketi (Örn: v2.5.0)'
        required: true
        default: 'v3.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Single-File Executable
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64

      - name: Rename and Package Artifacts
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          if (-not $tag) { $tag = "v3.0.0" }
          
          # Rename executable to standard ascii name for distribution
          Copy-Item "publish\win-x64\Bak*.exe" "publish\win-x64\Bakim.exe"
          
          # Create zip package
          Compress-Archive -Path "publish\win-x64\Bakim.exe" -DestinationPath "Bakim-$tag-win-x64.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          if (-not $tag) { $tag = "v3.0.0" }
          $cleanVersion = $tag.TrimStart('v', 'V')
          
          New-Item -ItemType Directory -Path "Releases" -Force | Out-Null
          Copy-Item "publish\win-x64\Bakim.exe" "Releases\Bakim.exe"
          
          $iscc = Get-Command "iscc.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
              $possiblePaths = @(
                  "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
                  "C:\Program Files\Inno Setup 6\ISCC.exe",
                  "C:\ProgramData\chocolatey\bin\iscc.exe"
              )
              $iscc = $possiblePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe bulunamadı!" }
          Write-Host "ISCC bulundu: $iscc"
          & $iscc "/DMyAppVersion=$cleanVersion" "Bakim_Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derleme hatası: $LASTEXITCODE" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Bakım ${{ env.TAG_NAME }} - AI Sezgisel Tehdit Analizörü & Kalıntı Temizleme (V44.0)
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            • **AI Sezgisel Dosya Tehdit Analizörü & Açıklama Kalkanı (V44.0)**:
              - Herhangi bir `.exe`, `.dll`, `.sys`, `.bat` veya Autoruns kaydını derinlemesine inceleyip zararlı olma nedenlerini Türkçe açıklayan modern tehdit analiz motoru eklendi.
              - **6+1 Katmanlı Güvenlik Vektörü**: WinVerifyTrust Authenticode sertifika doğrulaması, şüpheli çalışma dizini (Temp, Public), sahte System32 taklit tespiti (`svchost.exe` vb.), gizli konsol parametreleri (`-w hidden`, `-enc`), çift uzantı ve Unicode RLO (`\u202E`) tuzağı tespiti.
              - **Shannon Entropi Analizi**: Dosya bayt dağılımının bilgi yoğunluğunu (0.0 - 8.0) hesaplayarak UPX, Themida, VMProtect veya özel packer/crypter'ları anında yakalama.
              - **Mark of the Web (MOTW)**: NTFS `:Zone.Identifier` alternatif veri akışı ile dosyanın internetten/tarayıcıdan indirilip doğrudan başlangıca yerleştiğini tespit etme.
              - **Aktif Süreç Tespiti & Aksiyon Paketi**: Dosya bellekte çalışıyorsa tek tıkla "Süreci Sonlandır" (Process Tree Kill), başlangıçtan devre dışı bırakma, sahiplik alıp zorla parçalayarak silme (Shred) ve Markdown formatında teknik analiz raporu kopyalama.
              - Autoruns, Program Kaldırıcı ve Avcı Modu üzerinden tek tıkla dosya inceleme ve serbest dosya seçici ("Dosya İncele") entegrasyonu.
            • **İnteraktif Kalıntı Temizleme Modalı (Residual Cleanup Dialog - V42.0)**:
              - Standart kaldırma işlemi biter bitmez otomatik açılan Revo stili kalıntı temizleme modalı.
              - Kategori filtreleme (Tümü, Klasörler, Dosyalar, Kayıt Defteri), master seçim kutusu ve canlı boyut hesaplama.
            • **Sysinternals Autoruns (V41.0) & VirusTotal API v3 Entegrasyonu**:
              - 8 Kalıcılık Vektörü, tek tıkla toplu VirusTotal taraması ve kalıcı API anahtarı yönetimi.
          files: |
            Releases/Bakim-*-Setup.exe
            publish/win-x64/Bakim.exe
            Bakim-*.zip
