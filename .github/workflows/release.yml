name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Sürüm Etiketi (Örn: v2.5.0)'
        required: true
        default: 'v3.11.1'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Verify Tag Matches BakimVersion
        shell: pwsh
        run: |
          # Tek sürüm kaynağı: Directory.Build.props. Etiket farklıysa uygulama kendini eski
          # sürüm sanar ve sonsuz güncelleme döngüsüne girer; sürüm burada durdurulur.
          $props = [xml](Get-Content Directory.Build.props)
          $expected = "v" + $props.Project.PropertyGroup.BakimVersion
          if ($env:TAG_NAME -ne $expected) { throw "Etiket ($env:TAG_NAME) BakimVersion ($expected) ile aynı değil!" }

      - name: Verify XAML Design Tokens and Symbols
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python Tools/verify-tokens.py
          if ($LASTEXITCODE -ne 0) { throw "Design token doğrulaması başarısız!" }
          python Tools/verify-symbols.py
          if ($LASTEXITCODE -ne 0) { throw "SymbolRegular sembol doğrulaması başarısız!" }
          python Tools/verify-design-debt.py
          if ($LASTEXITCODE -ne 0) { throw "Tasarım/kod borcu eşiği aşıldı (Tools/design-debt-baseline.json)!" }
          python Tools/verify-bindings.py
          if ($LASTEXITCODE -ne 0) { throw "Sayfada görünüm modelinde olmayan bir özelliğe bağlama var!" }

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Unit Tests
        shell: pwsh
        run: |
          dotnet test --configuration Release --verbosity normal
          if ($LASTEXITCODE -ne 0) { throw "Birim testler başarısız oldu!" }

      - name: Publish Single-File Executable
        shell: pwsh
        run: |
          $proj = (Get-ChildItem -Path . -Filter "*Bak*.csproj" -File | Select-Object -First 1).FullName
          Write-Host "Hedef proje derleniyor: $proj"
          $version = $env:TAG_NAME.TrimStart('v', 'V')
          dotnet publish $proj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$version -p:AssemblyVersion=$version.0 -p:FileVersion=$version.0 -o publish/win-x64
          Write-Host "BakimShell projesi derleniyor..."
          dotnet publish Tools/BakimShell/BakimShell.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version -p:AssemblyVersion=$version.0 -p:FileVersion=$version.0 -o publish/win-x64

      - name: Rename and Package Artifacts
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          if (-not $tag) { throw "Sürüm etiketi yok." }
          
          # Derleme adi artik dogrudan Bakim.exe uretiyor (AssemblyName).
          # Kendine kopyalama hata verecegi icin yalnizca varligi dogrulanir.
          if (-not (Test-Path "publish\win-x64\Bakim.exe")) {
              throw "Bakim.exe bulunamadi - AssemblyName degismis olabilir."
          }
          if (-not (Test-Path "publish\win-x64\BakimShell.exe")) {
              throw "BakimShell.exe bulunamadi."
          }
          
          # Create zip package
          Compress-Archive -Path "publish\win-x64\Bakim.exe", "publish\win-x64\BakimShell.exe" -DestinationPath "Bakim-$tag-win-x64.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          if (-not $tag) { throw "Sürüm etiketi yok." }
          $cleanVersion = $tag.TrimStart('v', 'V')
          
          New-Item -ItemType Directory -Path "Releases" -Force | Out-Null
          Copy-Item "publish\win-x64\Bakim.exe" "Releases\Bakim.exe"
          Copy-Item "publish\win-x64\BakimShell.exe" "Releases\BakimShell.exe"
          
          $iscc = Get-Command "iscc.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
              $possiblePaths = @(
                  "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
                  "C:\Program Files\Inno Setup 6\ISCC.exe",
                  "C:\ProgramData\chocolatey\bin\iscc.exe"
              )
              $iscc = $possiblePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe bulunamadı!" }
          Write-Host "ISCC bulundu: $iscc"
          & $iscc "/DMyAppVersion=$cleanVersion" "Bakim_Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derleme hatası: $LASTEXITCODE" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Bakım ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body_path: CHANGELOG_LATEST.md
          files: |
            Releases/Bakim-*-Setup.exe
            publish/win-x64/Bakim.exe
            publish/win-x64/BakimShell.exe
            Bakim-*.zip
