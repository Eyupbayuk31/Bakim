name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Sürüm Etiketi (Örn: v2.5.0)'
        required: true
        default: 'v3.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Single-File Executable
        shell: pwsh
        run: |
          $proj = (Get-ChildItem -Path . -Filter "*Bak*.csproj" -File | Select-Object -First 1).FullName
          Write-Host "Hedef proje derleniyor: $proj"
          dotnet publish $proj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64

      - name: Rename and Package Artifacts
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          if (-not $tag) { $tag = "v3.1.0" }
          
          # Derleme adi artik dogrudan Bakim.exe uretiyor (AssemblyName).
          # Kendine kopyalama hata verecegi icin yalnizca varligi dogrulanir.
          if (-not (Test-Path "publish\win-x64\Bakim.exe")) {
              throw "Bakim.exe bulunamadi - AssemblyName degismis olabilir."
          }
          
          # Create zip package
          Compress-Archive -Path "publish\win-x64\Bakim.exe" -DestinationPath "Bakim-$tag-win-x64.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          if (-not $tag) { $tag = "v3.1.0" }
          $cleanVersion = $tag.TrimStart('v', 'V')
          
          New-Item -ItemType Directory -Path "Releases" -Force | Out-Null
          Copy-Item "publish\win-x64\Bakim.exe" "Releases\Bakim.exe"
          
          $iscc = Get-Command "iscc.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
              $possiblePaths = @(
                  "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
                  "C:\Program Files\Inno Setup 6\ISCC.exe",
                  "C:\ProgramData\chocolatey\bin\iscc.exe"
              )
              $iscc = $possiblePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe bulunamadı!" }
          Write-Host "ISCC bulundu: $iscc"
          & $iscc "/DMyAppVersion=$cleanVersion" "Bakim_Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derleme hatası: $LASTEXITCODE" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Bakım ${{ env.TAG_NAME }} - Tasarım Sistemi, Güvenlik Sertleştirme ve Mimari Yenileme
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            • **Güvenlik Sertleştirme**:
              - Kaynağa gömülü yönetici parolası tamamen kaldırıldı.
              - Hesap veritabanı artık yalnızca yereldir; uzak sunucudan kullanıcı çekilmez.
              - Parola türetme OWASP 2023 önerisine yükseltildi (PBKDF2-SHA256, 210.000 tur). Eski hesaplar ilk girişte sessizce güçlendirilir.
              - Kaba kuvvet denemeleri artan bekleme süresiyle frenlenir; yerel kilidi unutanlar için kurtarma yolu eklendi.
              - Güncelleme paketi çalıştırılmadan önce kaynak adresi, Authenticode imzası ve SHA-256 özeti denetlenir.
              - VirusTotal API anahtarı düz metin yerine DPAPI ile şifrelenerek saklanır (mevcut anahtar otomatik taşınır).
            • **Tasarım Sistemi**:
              - Dört tema: Mica Koyu, AMOLED Saf Siyah, Cyberpunk Neon Mor ve **yeni Fluent Açık**.
              - Tema değişimi artık arayüzün tamamını boyuyor; seçilen tema açılışta geri yükleniyor.
              - Arayüzdeki 194 sabit renk kodu anlamsal tasarım token'larına taşındı; tipografi ve boşluk ölçeği tanımlandı.
              - Yeniden kullanılabilir bileşen kütüphanesi (başlık, metrik kapsülü, durum rozeti, KPI kartı, boş durum).
              - 90 erişilebilirlik etiketi eklendi; durum rozetleri anlamı yalnızca renkle taşımıyor.
              - Per-Monitor V2 DPI farkındalığı: çoklu monitörde arayüz bulanıklaşmıyor.
            • **Çalışmayan Ayarlar Gerçek Oldu**:
              - Sistem tepsisine küçültme (tepsi menüsü ve hızlı RAM temizleme ile).
              - Zamanlanmış otomatik RAM temizliği ve yüksek bellek uyarısı.
              - Çıkışta otomatik temizlik, Mica efekti anahtarı ve telemetri yenileme aralığı.
            • **Performans & Kararlılık**:
              - Modüller ilk açılışta değil, ilk gezinmede yükleniyor.
              - Canlı telemetri yalnızca görünen modülde çalışıyor; arka planda sistem sorgusu atılmıyor.
              - Dosya tabanlı günlükleme eklendi (Ayarlar → Log Klasörünü Aç), ayrıntılı günlük anahtarıyla.
              - Ayar dosyası atomik yazılıyor; bozuk dosya karantinaya alınıp varsayılanlara dönülüyor.
          files: |
            Releases/Bakim-*-Setup.exe
            publish/win-x64/Bakim.exe
            Bakim-*.zip
