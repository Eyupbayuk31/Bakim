name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Sürüm Etiketi (Örn: v2.5.0)'
        required: true
        default: 'v2.8.0'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Single-File Executable
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64

      - name: Rename and Package Artifacts
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          if (-not $tag) { $tag = "v2.8.0" }
          
          # Rename executable to standard ascii name for distribution
          Copy-Item "publish\win-x64\Bak*.exe" "publish\win-x64\Bakim.exe"
          
          # Create zip package
          Compress-Archive -Path "publish\win-x64\Bakim.exe" -DestinationPath "Bakim-$tag-win-x64.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          if (-not $tag) { $tag = "v2.8.0" }
          $cleanVersion = $tag.TrimStart('v', 'V')
          
          New-Item -ItemType Directory -Path "Releases" -Force | Out-Null
          Copy-Item "publish\win-x64\Bakim.exe" "Releases\Bakim.exe"
          
          $iscc = Get-Command "iscc.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
              $possiblePaths = @(
                  "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
                  "C:\Program Files\Inno Setup 6\ISCC.exe",
                  "C:\ProgramData\chocolatey\bin\iscc.exe"
              )
              $iscc = $possiblePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe bulunamadı!" }
          Write-Host "ISCC bulundu: $iscc"
          & $iscc "/DMyAppVersion=$cleanVersion" "Bakim_Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derleme hatası: $LASTEXITCODE" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Bakım ${{ env.TAG_NAME }} - Autoruns & Persistence Analyzer (V41.0)
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            • **Sysinternals Autoruns & Persistence Analyzer (V41.0)**:
              - Windows başlangıç ve kalıcılık noktalarını derinlemesine tarayan Sysinternals seviyesinde yepyeni analiz modülü eklendi.
              - 8 Kalıcılık Vektörü: Run/RunOnce (HKCU/HKLM), WOW6432Node, Winlogon, IFEO Debugger saptırma, AppInit_DLLs, Başlangıç klasörleri (.lnk çözümü), Zamanlanmış Görevler (SchTasks) ve Windows Servisleri.
              - **WinVerifyTrust Doğrulaması**: Dosyaların gerçekliğini doğrulamak için Win32 wintrust.dll ile hem Authenticode hem de Windows Catalog (.cat) dijital imza denetimi.
              - **VirusTotal Entegrasyonu**: Kilitlenmeyen SHA-256 hesaplama ve tek tıkla VirusTotal rapor sayfasına yönlendirme / puanlama.
              - **Güvenli Geri Alınabilir Aç/Kapa**: Girdileri silmeden `Bakim_Disabled_` öneki, task disable ve servis yapılandırması ile güvenli pasifleştirme.
              - **Sysinternals Filtresi**: "Microsoft Girdilerini Gizle" ve "Yalnızca İmzasızları Göster" ile şüpheli yazılımları anında tespit etme.
              - **CSV Dışa Aktarma & Sanallaştırılmış UI**: Binlerce girdiyi sıfır kasma ile listeleyen VirtualizingStackPanel arayüzü ve CSV raporlama.
            • **Avcı Modu Saydamlık Düzeltmesi (Hunter Dialog Fix)**:
              - Hedef yakalama diyalogundaki arka plan sızması (transparency bleed-through) tamamen giderildi; %100 opak Slate Dark `#1E293B` paneli ve yüksek kontrastlı butonlar uygulandı.
          files: |
            Releases/Bakim-*-Setup.exe
            publish/win-x64/Bakim.exe
            Bakim-*.zip
